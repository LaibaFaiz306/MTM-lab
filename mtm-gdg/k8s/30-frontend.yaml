apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: mtm-gdg }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: DOCKER_REGISTRY/mtm-gdg-frontend:IMAGE_TAG
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 5 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: mtm-gdg }
spec:
  type: NodePort          # reachable at <node-ip>:30080, no ingress controller needed
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80, nodePort: 30080 }]
