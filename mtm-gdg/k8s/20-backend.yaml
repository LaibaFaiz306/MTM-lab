apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: mtm-gdg }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: DOCKER_REGISTRY/mtm-gdg-backend:IMAGE_TAG
          ports: [{ containerPort: 3000 }]
          env:
            - { name: DB_HOST, value: postgres }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: gdg-secrets, key: POSTGRES_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: gdg-secrets, key: POSTGRES_PASSWORD } } }
            - { name: DB_NAME, valueFrom: { secretKeyRef: { name: gdg-secrets, key: POSTGRES_DB } } }
            - { name: ADMIN_TOKEN, valueFrom: { secretKeyRef: { name: gdg-secrets, key: ADMIN_TOKEN } } }
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 20, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: mtm-gdg }
spec:
  selector: { app: backend }
  ports: [{ port: 3000 }]
