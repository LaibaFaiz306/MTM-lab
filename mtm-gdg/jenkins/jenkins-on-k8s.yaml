# Optional: run Jenkins itself inside your cluster.  kubectl apply -f jenkins/jenkins-on-k8s.yaml
# Then open http://<node-ip>:32000   (admin password: kubectl -n jenkins logs deploy/jenkins)
apiVersion: v1
kind: Namespace
metadata: { name: jenkins }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: jenkins-pvc, namespace: jenkins }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: jenkins, namespace: jenkins }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: jenkins-admin }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects: [{ kind: ServiceAccount, name: jenkins, namespace: jenkins }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: jenkins, namespace: jenkins }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: jenkins } }
  template:
    metadata: { labels: { app: jenkins } }
    spec:
      serviceAccountName: jenkins
      securityContext: { runAsUser: 0 }   # root so the agent can use the host Docker socket
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk17
          ports: [{ containerPort: 8080 }, { containerPort: 50000 }]
          volumeMounts:
            - { name: home, mountPath: /var/jenkins_home }
            - { name: docker-sock, mountPath: /var/run/docker.sock }
      volumes:
        - name: home
          persistentVolumeClaim: { claimName: jenkins-pvc }
        - name: docker-sock
          hostPath: { path: /var/run/docker.sock }
---
apiVersion: v1
kind: Service
metadata: { name: jenkins, namespace: jenkins }
spec:
  type: NodePort
  selector: { app: jenkins }
  ports:
    - { name: http, port: 8080, targetPort: 8080, nodePort: 32000 }
    - { name: agent, port: 50000, targetPort: 50000 }
